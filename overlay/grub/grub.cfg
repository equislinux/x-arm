set default=0
set timeout=15

if loadfont ${prefix}/fonts/unicode.pf2 ; then
  insmod all_video
  insmod gfxterm
  set gfxmode=auto
  terminal_output gfxterm
fi

search --no-floppy --set=root --file /%INSTALL_DIR%/%ARCHISO_SEARCH_FILENAME%

insmod png
if [ -f (${root})/syslinux/splash.png ]; then
  background_image -m stretch (${root})/syslinux/splash.png
fi

set linux_path=/%INSTALL_DIR%/boot/%ARCH%/Image
set initrd_path=/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img

menuentry 'x Linux install medium (%ARCH%, UEFI)' {
  linux ${linux_path} archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%
  initrd ${initrd_path}
}

# Unattended install (xauto=1 + a disk labeled cidata with x-install.json).
menuentry 'x Linux autoinstall (%ARCH%, UEFI)' --hotkey=a {
  linux ${linux_path} archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% xauto=1 console=ttyAMA0
  initrd ${initrd_path}
}

menuentry 'x Linux install medium (%ARCH%, UEFI) with speech' {
  linux ${linux_path} archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on
  initrd ${initrd_path}
}

menuentry 'UEFI Firmware Settings' {
  fwsetup
}

menuentry 'System shutdown' {
  halt
}

menuentry 'System restart' {
  reboot
}
