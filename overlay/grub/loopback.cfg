# https://www.supergrubdisk.org/wiki/Loopback.cfg
# aarch64 variant: /boot/Image and initramfs-linux.img.

# Search for the ISO volume
search --no-floppy --set=x_img_dev --file "${iso_path}"
probe --set x_img_dev_uuid --fs-uuid "${x_img_dev}"

# Get a human readable platform identifier
if [ "${grub_platform}" == 'efi' ]; then
    x_platform='UEFI'
elif [ "${grub_platform}" == 'pc' ]; then
    x_platform='BIOS'
else
    x_platform="${grub_cpu}-${grub_platform}"
fi

# Set default menu entry
default=x
timeout=10
timeout_style=menu

# Menu entries

menuentry "x Linux install medium (%ARCH%, ${x_platform})" --class x --class gnu-linux --class gnu --class os --id 'x' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/Image archisobasedir=%INSTALL_DIR% img_dev=UUID=${x_img_dev_uuid} img_loop="${iso_path}"
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "x Linux autoinstall (%ARCH%, ${x_platform})" --hotkey a --class x --class gnu-linux --class gnu --class os --id 'x-autoinstall' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/Image archisobasedir=%INSTALL_DIR% img_dev=UUID=${x_img_dev_uuid} img_loop="${iso_path}" xauto=1 console=ttyAMA0
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "x Linux install medium with speakup screen reader (%ARCH%, ${x_platform})" --hotkey s --class x --class gnu-linux --class gnu --class os --id 'x-accessibility' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/Image archisobasedir=%INSTALL_DIR% img_dev=UUID=${x_img_dev_uuid} img_loop="${iso_path}" accessibility=on
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

# Optional tools
if [ "${grub_platform}" == 'efi' -a "${grub_cpu}" == 'arm64' -a -f '/shellaa64.efi' ]; then
    menuentry 'UEFI Shell' --class efi {
        chainloader /shellaa64.efi
    }
fi

if [ "${grub_platform}" == 'efi' ]; then
    menuentry 'UEFI Firmware Settings' --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry 'System shutdown' --class shutdown --class poweroff {
    echo 'System shutting down...'
    halt
}

menuentry 'System restart' --class reboot --class restart {
    echo 'System rebooting...'
    reboot
}
