#
# /etc/pacman.conf — X Linux live (aarch64)
#
[options]
HoldPkg     = pacman glibc
Architecture = aarch64
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# X repo
[x]
# The project key is imported and locally signed at boot by x-keyring.service
# (after pacman-init.service recreates the keyring on tmpfs).
SigLevel = Required
Server = https://equislinux.github.io/x-repo/repo/aarch64

# Arch Linux ARM repos
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[alarm]
Include = /etc/pacman.d/mirrorlist

[aur]
Include = /etc/pacman.d/mirrorlist
